[package]
name = "ytgrab"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
serde_json = "1.0.154"
tiny_http = "0.12"

# Dev on macOS without the Metal toolchain: compile shaders at runtime. Windows is unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# Embeds assets/icon.ico in ytgrab.exe; only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
