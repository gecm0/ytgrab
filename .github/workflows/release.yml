name: Release

# Push a tag like v0.2.0 to build everything and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Rebuild the app only if it (or this workflow) changed since the previous tag;
  # otherwise the release reuses that tag's binaries.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      prev: ${{ steps.diff.outputs.prev }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- app .github/workflows/release.yml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo build --release
        working-directory: app
      # Same layout as the README: ytgrab.exe plus bin/ with the tools it runs.
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'ytgrab'
          New-Item -ItemType Directory "$dir/bin" | Out-Null
          Copy-Item app/target/release/ytgrab.exe $dir/
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$dir/bin/yt-dlp.exe"
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$dir/bin"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          # yt-dlp looks for ffprobe next to the ffmpeg it is pointed at.
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe "$dir/bin/"
          Compress-Archive $dir ytgrab-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ytgrab-windows-x64.zip

  macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo build --release
        working-directory: app
      # ponytail: bare binary, tools come from PATH (brew). Add a signed .app bundle if non-dev users need macOS.
      - run: tar -czf ytgrab-macos-arm64.tar.gz -C app/target/release ytgrab
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ytgrab-macos-arm64.tar.gz

  release:
    needs: [changes, windows, macos]
    # Run when the builds succeeded or were skipped, never after a failure.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package extension
        run: cd extension && zip -r ../ytgrab-extension.zip . -x '*.test.js'
      - if: needs.changes.outputs.build == 'true'
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Reuse binaries from ${{ needs.changes.outputs.prev }}
        if: needs.changes.outputs.build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.changes.outputs.prev }}" -p 'ytgrab-windows-x64.zip' -p 'ytgrab-macos-arm64.tar.gz'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ytgrab-windows-x64.zip ytgrab-macos-arm64.tar.gz ytgrab-extension.zip
